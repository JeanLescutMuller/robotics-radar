# Copy to ~/.config/robotics-radar/config.yaml (chmod 600) and fill in the real values there.
# Never put a real id, email or answer in this file: the repo is public.
timezone: Europe/Zurich
lookahead_days: 183
announcement_lookback_days: 30
minimum_task_score: 60
minimum_notification_score: 75   # notifications not built yet (DESIGN.md §9)
minimum_registration_score: 75   # free events only (DESIGN.md §5)
calendar:                        # the shared, public calendar stage A keeps up to date
  target_id: <shared calendar id>@group.calendar.google.com
  title_prefix: "🤖 "
  marker: ROBOTICS_RADAR_AUTO
  invite_email: <your Google account email>   # you, a guest of each entry: stage B registers you for the ones you accept
todoist:
  project_id: <Professional project id>
  section_id: <Robotics section id>
  description_prefix: "Subsection: Events"
  chatgpt_log_task_id: <task holding ChatGPT dry-run comments>
luma:
  account_email: <your Luma account email>   # logged in by email code (src/luma.py)
form:                            # answers the radar may put on a registration form
  email: <you>+events@gmail.com
  first_name: <first name>
  last_name: <last name>
  company: <company>
  role: <role>
  linkedin: <profile URL>
  phone: "<+41 …>"              # only on forms that require one
registration:
  submit: false                  # stop before the final click, save a screenshot (DESIGN.md §5)
dry_run: true
